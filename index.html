<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元太科技 8069 即時股價</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e5e7eb;
    --up:#d6283b; --down:#14904a; --flat:#4b5563; --accent:#1f4fd1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1218; --card:#181c25; --ink:#e8eaf0; --muted:#9aa3b2; --line:#2a3040; --accent:#6d93ff; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--ink);display:flex;justify-content:center;padding:32px 16px}
  .card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{margin:0;font-size:22px}
  .code{color:var(--muted);font-size:14px;margin-top:4px}
  button{border:0;background:var(--accent);color:#fff;font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer;
         display:flex;align-items:center;gap:6px;white-space:nowrap}
  button:disabled{opacity:.6;cursor:wait}
  .spin{display:inline-block}
  button:disabled .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .price-row{display:flex;align-items:baseline;gap:14px;margin:26px 0 6px;flex-wrap:wrap}
  .price{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .chg{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .time{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
        border-radius:12px;overflow:hidden;margin-top:22px}
  .grid div{background:var(--card);padding:12px}
  .grid span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .grid b{font-size:17px;font-variant-numeric:tabular-nums}
  svg{width:100%;height:120px;margin-top:20px;display:block}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:13px;gap:10px;flex-wrap:wrap}
  .foot label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .msg{margin-top:14px;font-size:13px;color:var(--up);min-height:1em}
  .note{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <header>
    <div>
      <h1>元太科技 E Ink Holdings</h1>
      <div class="code">8069 · 上櫃（TPEx）· 新台幣</div>
    </div>
    <button id="refresh"><span class="spin">⟳</span> 更新</button>
  </header>

  <div class="price-row">
    <div class="price" id="price">--</div>
    <div class="chg" id="chg"></div>
  </div>
  <div class="time" id="time">載入中…</div>

  <div class="grid">
    <div><span>開盤</span><b id="open">--</b></div>
    <div><span>最高</span><b id="high">--</b></div>
    <div><span>最低</span><b id="low">--</b></div>
    <div><span>昨收</span><b id="prev">--</b></div>
    <div><span>成交量（張）</span><b id="vol">--</b></div>
    <div><span>買 / 賣</span><b id="ba">--</b></div>
  </div>

  <svg id="chart" viewBox="0 0 500 120" preserveAspectRatio="none" aria-label="近期走勢"></svg>
  <div class="time" id="chartLabel"></div>

  <div class="foot">
    <label><input type="checkbox" id="auto"> 盤中每 30 秒自動更新</label>
    <span id="src"></span>
  </div>
  <div class="msg" id="msg"></div>

  <p class="note">資料來源：即時報價取自臺灣證券交易所基本市況報導（MIS，經 r.jina.ai 轉送）；走勢圖與備援收盤價取自 FinMind。
    報價可能有數秒延遲，僅供參考，不構成投資建議。</p>
</main>

<script>
const SYMBOL = "8069";
// 即時報價：證交所 MIS，經 r.jina.ai 轉送（GitHub Pages 無法直接跨網域呼叫證交所）
const MIS_URL = () =>
  `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=otc_${SYMBOL}.tw&json=1&delay=0&_=${Date.now()}`;
// 備援與走勢圖：FinMind 日成交資料（支援跨網域）
const FINMIND_URL = start =>
  `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${SYMBOL}&start_date=${start}`;

const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null; };
const fmt = (n, d = 2) => n == null ? "--" : n.toLocaleString("zh-TW", {minimumFractionDigits:d, maximumFractionDigits:d});

async function fetchWithTimeout(url, opts = {}, ms = 10000){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal: ctrl.signal, cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  }catch(e){
    throw e.name === "AbortError" ? new Error("連線逾時") : e;
  }finally{ clearTimeout(t); }
}

async function fromMIS(){
  const text = await fetchWithTimeout(`https://r.jina.ai/${MIS_URL()}`,
    {headers: {"X-No-Cache": "true", "X-Return-Format": "text"}});
  const m = text.match(/\{"msgArray"[\s\S]*\}/);
  if (!m) throw new Error("即時報價格式錯誤");
  const s = JSON.parse(m[0]).msgArray[0];
  if (!s) throw new Error("即時報價無資料");
  const bids = (s.b || "").split("_").map(num).filter(Boolean);
  const asks = (s.a || "").split("_").map(num).filter(Boolean);
  // z 為最近成交價；"-" 表示該 5 秒無成交，改用 trade.z（最後一筆成交），再不行用買賣中點
  let price = num(s.z) ?? num(s.trade && s.trade.z);
  if (price == null && bids[0] && asks[0]) price = (bids[0] + asks[0]) / 2;
  if (price == null) price = bids[0] || asks[0] || null;
  return {
    price, prev: num(s.y), open: num(s.o), high: num(s.h), low: num(s.l),
    vol: s.v ? parseInt(s.v, 10) : null, bid: bids[0], ask: asks[0],
    time: s.tlong ? new Date(parseInt(s.tlong, 10)) : new Date(),
    source: "證交所即時報價",
  };
}

async function fetchDaily(){
  const d = new Date(Date.now() - 45 * 864e5).toISOString().slice(0, 10);
  const j = JSON.parse(await fetchWithTimeout(FINMIND_URL(d)));
  if (!j.data || !j.data.length) throw new Error("日資料無內容");
  return j.data;
}

function fromDaily(rows){
  const last = rows[rows.length - 1], before = rows[rows.length - 2];
  return {
    price: last.close, prev: before ? before.close : last.close - last.spread,
    open: last.open, high: last.max, low: last.min,
    vol: Math.round(last.Trading_Volume / 1000), bid: null, ask: null,
    time: new Date(last.date + "T13:30:00+08:00"), source: "FinMind 收盤資料（即時報價暫時無法取得）",
  };
}

function drawChart(rows, livePrice, cls){
  const svg = $("chart");
  if (!rows || rows.length < 2){ svg.innerHTML = ""; return; }
  const today = new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Taipei"});
  const series = rows.map(r => r.close);
  if (livePrice != null){
    if (rows[rows.length - 1].date === today) series[series.length - 1] = livePrice;
    else series.push(livePrice);
  }
  const min = Math.min(...series), max = Math.max(...series), span = (max - min) || 1;
  const W = 500, H = 120, pad = 6;
  const x = i => i / (series.length - 1) * W;
  const y = v => pad + (1 - (v - min) / span) * (H - pad * 2);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const color = getComputedStyle(document.documentElement)
    .getPropertyValue(cls === "down" ? "--down" : cls === "up" ? "--up" : "--flat");
  svg.innerHTML =
    `<polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" fill-opacity=".08"/>` +
    `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>` +
    `<circle cx="${x(series.length - 1)}" cy="${y(series[series.length - 1])}" r="3.5" fill="${color}"/>`;
  $("chartLabel").textContent = `近 ${series.length} 個交易日收盤走勢（${fmt(min)} – ${fmt(max)}）`;
}

function render(d){
  const diff = d.price != null && d.prev != null ? d.price - d.prev : null;
  const cls = diff == null || Math.abs(diff) < 1e-9 ? "flat" : diff > 0 ? "up" : "down";
  $("price").textContent = fmt(d.price);
  $("price").className = "price " + cls;
  $("chg").className = "chg " + cls;
  $("chg").textContent = diff == null ? "" :
    `${diff > 0 ? "▲" : diff < 0 ? "▼" : ""} ${fmt(Math.abs(diff))} (${diff >= 0 ? "+" : "-"}${fmt(Math.abs(diff / d.prev * 100))}%)`;
  $("open").textContent = fmt(d.open);
  $("high").textContent = fmt(d.high);
  $("low").textContent = fmt(d.low);
  $("prev").textContent = fmt(d.prev);
  $("vol").textContent = d.vol == null ? "--" : d.vol.toLocaleString("zh-TW");
  $("ba").textContent = d.bid || d.ask ? `${fmt(d.bid)} / ${fmt(d.ask)}` : "--";
  $("time").textContent = "資料時間：" + d.time.toLocaleString("zh-TW", {hour12:false}) +
    "　·　擷取於 " + new Date().toLocaleTimeString("zh-TW", {hour12:false});
  $("src").textContent = "來源：" + d.source;
  document.title = `${fmt(d.price)} ${diff > 0 ? "▲" : diff < 0 ? "▼" : ""} 元太 8069`;
  return cls;
}

let busy = false, dailyCache = null;
async function update(){
  if (busy) return;
  busy = true; $("refresh").disabled = true; $("msg").textContent = "";
  if ($("price").textContent === "--") $("time").textContent = "載入中…";
  const [live, daily] = await Promise.allSettled([fromMIS(), dailyCache ? Promise.resolve(dailyCache) : fetchDaily()]);
  if (daily.status === "fulfilled") dailyCache = daily.value;
  try{
    let d, livePrice = null;
    if (live.status === "fulfilled"){ d = live.value; livePrice = d.price; }
    else if (dailyCache){ d = fromDaily(dailyCache); $("msg").textContent = "即時報價暫時無法取得（" + live.reason.message + "），先顯示最近收盤。"; }
    else throw live.reason;
    const cls = render(d);
    drawChart(dailyCache, livePrice, cls);
  }catch(e){
    $("msg").textContent = "更新失敗：" + e.message + "，請稍後再按「更新」。";
    $("time").textContent = "";
  }finally{
    busy = false; $("refresh").disabled = false;
  }
}

// 台股盤中（週一至週五 09:00–13:30，台北時間）
function marketOpen(){
  const tw = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
  const day = tw.getDay(), mins = tw.getHours() * 60 + tw.getMinutes();
  return day >= 1 && day <= 5 && mins >= 540 && mins <= 810;
}

let timer = null;
$("auto").addEventListener("change", e => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(() => { if (marketOpen()) update(); }, 30000);
});
$("refresh").addEventListener("click", update);
update();
</script>
</body>
</html>
