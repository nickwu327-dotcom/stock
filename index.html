<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="台股報價">
<title>台股即時股價｜元太・台虹・漢磊・國巨</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e8eaee;
    --up:#d6283b; --down:#14904a; --flat:#6b7280; --accent:#1f4fd1;
    --up-bg:#d6283b; --down-bg:#14904a; --flat-bg:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1218; --card:#181c25; --ink:#e8eaf0; --muted:#9aa3b2; --line:#262c3a; --accent:#6d93ff;
           --up:#ff5c6c; --down:#3ccf7e; --flat-bg:#4b5563; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
       padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}

  /* 頂部列（固定） */
  .bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
       backdrop-filter:saturate(1.8) blur(14px);-webkit-backdrop-filter:saturate(1.8) blur(14px);
       padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
  .bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .status{color:var(--muted);font-size:12px;margin-top:2px;min-height:1.3em}
  .iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;
           display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn:disabled{opacity:.6}
  .iconbtn:disabled .spin{animation:spin 1s linear infinite}
  .spin{display:inline-block;line-height:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px;cursor:pointer;user-select:none}
  .switch input{appearance:none;-webkit-appearance:none;width:36px;height:22px;border-radius:11px;background:var(--line);
                position:relative;margin:0;cursor:pointer;transition:background .2s}
  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
                       background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{left:16px}

  /* 股票清單 */
  .list{margin:12px 12px 0;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .item + .item{border-top:1px solid var(--line)}
  .row{display:grid;grid-template-columns:1fr 64px auto;align-items:center;gap:12px;padding:14px 16px;
       cursor:pointer;min-height:68px;user-select:none}
  .row:active{background:color-mix(in srgb,var(--line) 50%,transparent)}
  .nm{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spark{width:64px;height:30px;display:block}
  .right{text-align:right;min-width:88px}
  .price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;margin-top:4px;padding:3px 0;width:78px;text-align:center;border-radius:6px;color:#fff;
        font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--flat-bg)}
  .pill.up{background:var(--up-bg)} .pill.down{background:var(--down-bg)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink)}

  /* 展開明細 */
  .detail{display:none;padding:0 16px 16px}
  .item.open .detail{display:block}
  .chg{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .time{color:var(--muted);font-size:12px;margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stats div{background:var(--bg);border-radius:10px;padding:8px 10px}
  .stats span{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
  .stats b{font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
  .big{width:100%;height:110px;display:block;margin-top:14px}
  .chart-label{color:var(--muted);font-size:11px;margin-top:4px}
  .msg{font-size:12px;color:var(--up);margin-top:6px}
  .msg:empty{display:none}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:10px 16px 0}
  .note{color:var(--muted);font-size:11px;margin:16px 20px 0;line-height:1.6}

  @media (min-width:600px){ .list{margin:16px 0 0} .bar{padding-left:0;padding-right:0} .bar-row,.switch{padding:0 4px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="bar-row">
      <div>
        <h1>台股報價</h1>
        <div class="status" id="status">載入中…</div>
      </div>
      <button class="iconbtn" id="refresh" aria-label="更新"><span class="spin">⟳</span></button>
    </div>
    <label class="switch"><input type="checkbox" id="auto"> 盤中每 30 秒自動更新</label>
  </header>

  <div class="list" id="cards"></div>
  <p class="hint">點一下個股可展開明細</p>

  <p class="note">資料來源：即時報價取自臺灣證券交易所基本市況報導（MIS，經 r.jina.ai 轉送）；走勢圖與備援收盤價取自 FinMind。
    報價可能有數秒延遲，僅供參考，不構成投資建議。</p>
</div>

<script>
// 要顯示的股票：market 為 tse（上市）或 otc（上櫃）
const STOCKS = [
  {code: "8069", name: "元太科技", en: "E Ink Holdings", market: "otc"},
  {code: "8039", name: "台虹",     en: "Taiflex",        market: "tse"},
  {code: "3707", name: "漢磊",     en: "Episil",         market: "otc"},
  {code: "2327", name: "國巨",     en: "Yageo",          market: "tse"},
];
const MARKET_LABEL = {tse: "上市", otc: "上櫃"};

const MIS_URL = () =>
  `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${STOCKS.map(s => `${s.market}_${s.code}.tw`).join("%7C")}&json=1&delay=0&_=${Date.now()}`;
const FINMIND_URL = (code, start) =>
  `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${start}`;

const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null; };
const fmt = (n, d = 2) => n == null ? "--" : n.toLocaleString("zh-TW", {minimumFractionDigits:d, maximumFractionDigits:d});

// 建立清單
$("cards").innerHTML = STOCKS.map(s => `
  <section class="item" id="c${s.code}">
    <div class="row" role="button" aria-expanded="false">
      <div style="min-width:0">
        <div class="nm">${s.name}</div>
        <div class="meta">${s.code} · ${MARKET_LABEL[s.market]} · <span data-f="time">--</span></div>
      </div>
      <svg class="spark" data-f="spark" viewBox="0 0 64 30" preserveAspectRatio="none"></svg>
      <div class="right">
        <div class="price" data-f="price">--</div>
        <div class="pill" data-f="pill">--</div>
      </div>
    </div>
    <div class="detail">
      <div class="chg" data-f="chg"></div>
      <div class="stats">
        <div><span>開盤</span><b data-f="open">--</b></div>
        <div><span>最高</span><b data-f="high">--</b></div>
        <div><span>最低</span><b data-f="low">--</b></div>
        <div><span>昨收</span><b data-f="prev">--</b></div>
        <div><span>成交量(張)</span><b data-f="vol">--</b></div>
        <div><span>買 / 賣</span><b data-f="ba">--</b></div>
      </div>
      <svg class="big" data-f="chart" viewBox="0 0 500 110" preserveAspectRatio="none"></svg>
      <div class="chart-label" data-f="chartLabel"></div>
      <div class="msg" data-f="msg"></div>
    </div>
  </section>`).join("");
document.querySelectorAll(".item .row").forEach(r => r.addEventListener("click", () => {
  const it = r.parentElement, open = it.classList.toggle("open");
  r.setAttribute("aria-expanded", open);
}));
const field = (code, f) => document.querySelector(`#c${code} [data-f="${f}"]`);

async function fetchWithTimeout(url, opts = {}, ms = 15000){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal: ctrl.signal, cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  }catch(e){
    throw e.name === "AbortError" ? new Error("連線逾時") : e;
  }finally{ clearTimeout(t); }
}

// 一次取得全部股票的即時報價
async function fetchLive(){
  const text = await fetchWithTimeout(`https://r.jina.ai/${MIS_URL()}`,
    {headers: {"X-No-Cache": "true", "X-Return-Format": "text"}});
  const m = text.match(/\{"msgArray"[\s\S]*\}/);
  if (!m) throw new Error("即時報價格式錯誤");
  const out = {};
  for (const s of JSON.parse(m[0]).msgArray || []){
    const bids = (s.b || "").split("_").map(num).filter(Boolean);
    const asks = (s.a || "").split("_").map(num).filter(Boolean);
    // z 為最近成交價；"-" 表示該 5 秒無成交，改用 trade.z（最後一筆成交），再不行用買賣中點
    let price = num(s.z) ?? num(s.trade && s.trade.z);
    if (price == null && bids[0] && asks[0]) price = (bids[0] + asks[0]) / 2;
    if (price == null) price = bids[0] || asks[0] || null;
    out[s.c] = {
      price, prev: num(s.y), open: num(s.o), high: num(s.h), low: num(s.l),
      vol: s.v ? parseInt(s.v, 10) : null, bid: bids[0], ask: asks[0],
      time: s.tlong ? new Date(parseInt(s.tlong, 10)) : new Date(), live: true,
    };
  }
  return out;
}
async function fetchLiveRetry(){
  try{ return await fetchLive(); }
  catch(e){ return await fetchLive(); }   // 轉送服務偶爾很慢，失敗就再試一次
}

const dailyCache = {};
async function fetchDaily(code){
  if (dailyCache[code]) return dailyCache[code];
  const d = new Date(Date.now() - 45 * 864e5).toISOString().slice(0, 10);
  const j = JSON.parse(await fetchWithTimeout(FINMIND_URL(code, d)));
  if (!j.data || !j.data.length) throw new Error("日資料無內容");
  return dailyCache[code] = j.data;
}
function fromDaily(rows){
  const last = rows[rows.length - 1], before = rows[rows.length - 2];
  return {
    price: last.close, prev: before ? before.close : last.close - last.spread,
    open: last.open, high: last.max, low: last.min,
    vol: Math.round(last.Trading_Volume / 1000), bid: null, ask: null,
    time: new Date(last.date + "T13:30:00+08:00"), live: false,
  };
}

function line(svg, series, W, H, pad, color, area){
  const min = Math.min(...series), max = Math.max(...series), span = (max - min) || 1;
  const x = i => i / (series.length - 1) * W;
  const y = v => pad + (1 - (v - min) / span) * (H - pad * 2);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  svg.innerHTML = (area ? `<polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" fill-opacity=".1"/>` : "") +
    `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${area ? 2 : 1.6}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}
function drawChart(code, rows, livePrice, cls){
  if (!rows || rows.length < 2){ field(code, "chart").innerHTML = field(code, "spark").innerHTML = ""; return; }
  const today = new Date().toLocaleDateString("sv-SE", {timeZone: "Asia/Taipei"});
  const series = rows.map(r => r.close);
  if (livePrice != null){
    if (rows[rows.length - 1].date === today) series[series.length - 1] = livePrice;
    else series.push(livePrice);
  }
  const color = getComputedStyle(document.documentElement)
    .getPropertyValue(cls === "down" ? "--down" : cls === "up" ? "--up" : "--flat").trim();
  line(field(code, "spark"), series, 64, 30, 2, color, false);
  line(field(code, "chart"), series, 500, 110, 6, color, true);
  field(code, "chartLabel").textContent =
    `近 ${series.length} 個交易日收盤走勢　低 ${fmt(Math.min(...series))}・高 ${fmt(Math.max(...series))}`;
}

function render(code, d){
  const diff = d.price != null && d.prev != null ? d.price - d.prev : null;
  const cls = diff == null || Math.abs(diff) < 1e-9 ? "flat" : diff > 0 ? "up" : "down";
  const sign = diff > 0 ? "+" : diff < 0 ? "-" : "";
  const p = field(code, "price");
  p.textContent = fmt(d.price); p.className = "price " + cls;
  const pill = field(code, "pill");
  pill.className = "pill " + cls;
  pill.textContent = diff == null ? "--" : `${sign}${fmt(Math.abs(diff / d.prev * 100))}%`;
  const c = field(code, "chg");
  c.className = "chg " + cls;
  c.textContent = diff == null ? "" : `${diff > 0 ? "▲" : diff < 0 ? "▼" : ""} ${fmt(Math.abs(diff))}（${sign}${fmt(Math.abs(diff / d.prev * 100))}%）`;
  field(code, "open").textContent = fmt(d.open);
  field(code, "high").textContent = fmt(d.high);
  field(code, "low").textContent = fmt(d.low);
  field(code, "prev").textContent = fmt(d.prev);
  field(code, "vol").textContent = d.vol == null ? "--" : d.vol.toLocaleString("zh-TW");
  field(code, "ba").textContent = d.bid || d.ask ? `${fmt(d.bid)}/${fmt(d.ask)}` : "--";
  const t = d.time;
  const hm = t.toLocaleTimeString("zh-TW", {hour12:false, hour:"2-digit", minute:"2-digit", timeZone:"Asia/Taipei"});
  field(code, "time").textContent = d.live ? `即時 ${hm}` : `收盤 ${t.getMonth() + 1}/${t.getDate()}`;
  return cls;
}

const shown = {};   // 每檔目前畫面上的資料是否為即時
let busy = false;
async function update(){
  if (busy) return;
  busy = true; $("refresh").disabled = true;
  $("status").textContent = "正在取得即時報價…";
  STOCKS.forEach(s => field(s.code, "msg").textContent = "");

  const liveP = fetchLiveRetry();
  let liveDone = false; liveP.finally(() => { liveDone = true; }).catch(() => {});

  // 先拿日資料畫圖；若即時報價還沒到，先顯示最近收盤
  await Promise.allSettled(STOCKS.map(async s => {
    try{
      const rows = await fetchDaily(s.code);
      if (!liveDone && !shown[s.code]){
        drawChart(s.code, rows, null, render(s.code, fromDaily(rows)));
        shown[s.code] = "daily";
      }
    }catch(e){}
  }));

  try{
    const live = await liveP;
    for (const s of STOCKS){
      const d = live[s.code];
      if (!d){ field(s.code, "msg").textContent = "即時報價無此檔資料"; continue; }
      drawChart(s.code, dailyCache[s.code], d.price, render(s.code, d));
      shown[s.code] = "live";
    }
    $("status").textContent = "最後更新 " + new Date().toLocaleTimeString("zh-TW", {hour12:false});
  }catch(e){
    for (const s of STOCKS){
      if (!shown[s.code] && dailyCache[s.code]){
        drawChart(s.code, dailyCache[s.code], null, render(s.code, fromDaily(dailyCache[s.code])));
        shown[s.code] = "daily";
      }
    }
    $("status").textContent = "即時報價暫時無法取得，" + (Object.keys(shown).length ? "顯示最近收盤／上次資料" : "請稍後再試");
  }finally{
    busy = false; $("refresh").disabled = false;
  }
}

// 台股盤中（週一至週五 09:00–13:30，台北時間）
function marketOpen(){
  const tw = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
  const day = tw.getDay(), mins = tw.getHours() * 60 + tw.getMinutes();
  return day >= 1 && day <= 5 && mins >= 540 && mins <= 810;
}

let timer = null;
$("auto").addEventListener("change", e => {
  clearInterval(timer);
  if (e.target.checked) timer = setInterval(() => { if (marketOpen()) update(); }, 30000);
});
$("refresh").addEventListener("click", update);
update();
</script>
</body>
</html>
